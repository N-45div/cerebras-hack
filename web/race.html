<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GPU vs Cerebras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0a0d; --panel:#131318; --line:#24242c; --text:#ececf1; --dim:#8a8a96; --hot:#ff5a36; --gpu:#76b900; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; background: var(--bg); color: var(--text); font-family: Inter, sans-serif; overflow: hidden; }
  header { padding: 44px 64px 20px; }
  h1 { font-size: 54px; font-weight: 800; letter-spacing: -1px; }
  h1 .hot { color: var(--hot); }
  .sub { color: var(--dim); font-size: 22px; margin-top: 8px; }
  .lanes { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; padding: 16px 64px 0; height: 790px; }
  .lane { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 26px 30px; display: flex; flex-direction: column; position: relative; overflow: hidden; }
  .lane.cb { border-color: #ff5a3655; box-shadow: 0 0 60px #ff5a3618; }
  .who { font-size: 22px; font-weight: 600; }
  .who small { display: block; color: var(--dim); font-weight: 400; font-size: 17px; margin-top: 4px; }
  .nums { display: flex; gap: 34px; margin: 20px 0 16px; font-family: 'JetBrains Mono', monospace; }
  .num b { display: block; font-size: 56px; font-weight: 700; line-height: 1; }
  .num span { color: var(--dim); font-size: 15px; text-transform: uppercase; letter-spacing: 1px; }
  .cb .num.rate b { color: var(--hot); }
  .gp .num.rate b { color: var(--gpu); }
  .out { flex: 1; background: #0d0d11; border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; font: 15px/1.45 'JetBrains Mono', monospace; color: #c9c9d3; white-space: pre-wrap; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
  .done { position: absolute; left: 30px; right: 30px; bottom: 30px; padding: 26px 30px; border-radius: 14px; font-size: 40px; font-weight: 800; display: none; align-items: baseline; gap: 18px; }
  .cb .done { background: var(--hot); color: #fff; }
  .gp .done { background: #1f2a10; color: var(--gpu); border: 1px solid #76b90088; }
  .done small { font-size: 22px; font-weight: 600; opacity: .85; }
  .lane.finished .done { display: flex; }
  footer { position: absolute; bottom: 26px; left: 64px; right: 64px; color: var(--dim); font-size: 17px; display: flex; justify-content: space-between; }
  #x { color: var(--hot); font-weight: 800; font-size: 22px; opacity: 0; transition: opacity .4s; }
</style>
</head>
<body>
<header>
  <h1>Same 8 tabs. Same prompt. <span class="hot">Two machines.</span></h1>
  <div class="sub" id="sub">Tab Bankruptcy's clerk prompt: read each tab, file it, judge it, roast it.</div>
</header>
<div class="lanes">
  <div class="lane cb" id="cb">
    <div class="who" id="cbWho"></div>
    <div class="nums"><div class="num rate"><b id="cbRate">0</b><span>tokens / sec</span></div><div class="num"><b id="cbTok">0</b><span>tokens</span></div><div class="num"><b id="cbClock">0.0s</b><span>decode time</span></div></div>
    <div class="out" id="cbOut"></div>
    <div class="done" id="cbDone"></div>
  </div>
  <div class="lane gp" id="gp">
    <div class="who" id="gpWho"></div>
    <div class="nums"><div class="num rate"><b id="gpRate">0</b><span>tokens / sec</span></div><div class="num"><b id="gpTok">0</b><span>tokens</span></div><div class="num"><b id="gpClock">0.0s</b><span>decode time</span></div></div>
    <div class="out" id="gpOut"></div>
    <div class="done" id="gpDone"></div>
  </div>
</div>
<footer><span id="method"></span><span id="x"></span></footer>
<script>
const $ = (id) => document.getElementById(id);
const fmt = (n) => Math.round(n).toLocaleString('en-US');
(async () => {
  const R = await (await fetch('/out/race.json', { cache: 'no-store' })).json();
  $('cbWho').innerHTML = `${R.cerebras.label}<small>Cerebras Inference, server-measured decode</small>`;
  $('gpWho').innerHTML = `${R.gpu.label.split(' · ')[0]}<small>${R.gpu.label.split(' · ').slice(1).join(' · ')}, this laptop</small>`;
  $('method').textContent = 'Real outputs, replayed at each machine\'s measured decode speed. Queue and network time excluded on both sides.';
  await document.fonts.ready;
  // When recorded (?rec), wait for the recorder's start signal; otherwise a short beat.
  if (location.search.includes('rec')) while (!window.__START__) await new Promise((r) => setTimeout(r, 30));
  else await new Promise((r) => setTimeout(r, 1800));
  const t0 = performance.now();
  const lanes = [['cb', R.cerebras], ['gp', R.gpu]];
  const finished = new Set();
  function frame() {
    const t = (performance.now() - t0) / 1000;
    for (const [k, L] of lanes) {
      const f = Math.min(1, t / L.decodeS);
      $(k + 'Out').textContent = L.text.slice(0, Math.floor(L.text.length * f));
      $(k + 'Tok').textContent = fmt(L.tokens * f);
      $(k + 'Rate').textContent = fmt(f > 0 ? L.tps : 0);
      $(k + 'Clock').textContent = Math.min(t, L.decodeS).toFixed(1) + 's';
      if (f >= 1 && !finished.has(k)) {
        finished.add(k);
        $(k + 'Done').innerHTML = `DONE in ${L.decodeS.toFixed(1)}s <small>${fmt(L.tokens)} tokens at ${fmt(L.tps)} tok/s</small>`;
        $(k).classList.add('finished');
      }
    }
    if (finished.size < 2) setTimeout(frame, 16);
    else {
      $('x').textContent = `${R.speedup.toFixed(1)}× faster decode on Cerebras`;
      $('x').style.opacity = 1;
      window.__DONE__ = true;
    }
  }
  frame();
})();
</script>
</body>
</html>
